<svg width="1600" height="2154" viewBox="0 0 1600 2154" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffbc54" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ffbc54" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffbc54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lm-thames" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a15a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8f6f34" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="0" y="0" width="1600" height="2154" fill="#17130d"/>

  <!-- Road grid (drawn first; parks & river paint over it) -->
  <g stroke="#d8b46e" stroke-opacity="0.14" stroke-width="2.2">
    <path d="M0 120 H1600"/><path d="M0 250 H1600"/><path d="M0 380 H1600"/>
    <path d="M0 512 H1600"/><path d="M0 640 H1600"/><path d="M0 772 H1600"/>
    <path d="M0 900 H1600"/><path d="M0 1030 H1600"/><path d="M0 1160 H1600"/>
    <path d="M0 1292 H1600"/><path d="M0 1420 H1600"/><path d="M0 1552 H1600"/>
    <path d="M0 1680 H1600"/><path d="M0 1812 H1600"/><path d="M0 1944 H1600"/><path d="M0 2072 H1600"/>
    <path d="M110 0 V2154"/><path d="M250 0 V2154"/><path d="M392 0 V2154"/>
    <path d="M534 0 V2154"/><path d="M676 0 V2154"/><path d="M820 0 V2154"/>
    <path d="M962 0 V2154"/><path d="M1104 0 V2154"/><path d="M1246 0 V2154"/>
    <path d="M1388 0 V2154"/><path d="M1520 0 V2154"/>
  </g>

  <!-- Major avenues / rail -->
  <g stroke="#d8b46e" stroke-opacity="0.3" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M0 640 C 420 610 900 700 1600 660"/>
    <path d="M60 0 C 300 520 760 980 1180 1500 C 1360 1720 1470 1980 1600 2100"/>
    <path d="M1600 300 C 1200 620 760 900 300 1300 C 120 1460 40 1760 0 2010"/>
    <path d="M0 1160 C 500 1140 1000 1200 1600 1150"/>
  </g>

  <!-- Parks -->
  <g stroke="#4a5c33" stroke-opacity="0.7" stroke-width="2">
    <!-- Primrose Hill -->
    <path d="M612 470 q 150 -70 250 20 q 60 120 -60 190 q -170 60 -220 -60 q -40 -110 30 -150 Z" fill="#1c2415"/>
    <!-- Regent's Park -->
    <rect x="410" y="620" width="330" height="300" rx="70" fill="#1c2415"/>
    <!-- Hyde Park + Kensington Gardens -->
    <path d="M170 1140 h520 a40 40 0 0 1 40 40 v210 a40 40 0 0 1 -40 40 h-520 a40 40 0 0 1 -40 -40 v-210 a40 40 0 0 1 40 -40 Z" fill="#1c2415"/>
    <!-- Green Park -->
    <path d="M900 1300 q 130 -30 150 90 q 10 120 -120 130 q -110 0 -110 -120 q 0 -80 80 -100 Z" fill="#1c2415"/>
    <!-- St James's Park -->
    <rect x="1070" y="1360" width="210" height="120" rx="55" fill="#1c2415"/>
  </g>

  <!-- River Thames -->
  <path d="M-40 1760 C 280 1700 520 1900 760 1900 C 1010 1900 1120 1690 1360 1740 C 1490 1768 1560 1900 1640 1980"
        fill="none" stroke="url(#lm-thames)" stroke-width="64" stroke-linecap="round"/>
  <path d="M-40 1760 C 280 1700 520 1900 760 1900 C 1010 1900 1120 1690 1360 1740 C 1490 1768 1560 1900 1640 1980"
        fill="none" stroke="#d8b46e" stroke-opacity="0.5" stroke-width="3"/>

  <!-- Landmark: Royal Albert Hall (South Kensington) at ~(520,1160) -->
  <circle cx="520" cy="1160" r="150" fill="url(#lm-glow)"/>
  <g transform="translate(520 1160)">
    <ellipse cx="0" cy="0" rx="34" ry="24" fill="none" stroke="#ffbc54" stroke-width="3"/>
    <path d="M-34 0 a34 24 0 0 1 68 0" fill="#ffbc54" fill-opacity="0.28"/>
  </g>

  <!-- Landmark: KOKO Theatre (Camden) at ~(820,900) -->
  <circle cx="820" cy="900" r="160" fill="url(#lm-glow)"/>
  <g transform="translate(820 900)">
    <rect x="-30" y="-30" width="60" height="60" rx="6" fill="none" stroke="#ffbc54" stroke-width="3"/>
    <path d="M-30 8 h60 M-30 -8 h60 M-8 -30 v60 M8 -30 v60" stroke="#ffbc54" stroke-width="2" stroke-opacity="0.5"/>
  </g>

  <!-- Place labels -->
  <g fill="#d8b46e" fill-opacity="0.42" font-family="'DM Mono', ui-monospace, monospace" font-size="26" letter-spacing="3" text-transform="uppercase">
    <text x="120" y="170">CAMDEN TOWN</text>
    <text x="430" y="790" fill-opacity="0.5">REGENT'S PARK</text>
    <text x="720" y="560" fill-opacity="0.5">PRIMROSE HILL</text>
    <text x="980" y="980">FITZROVIA</text>
    <text x="1120" y="740">ISLINGTON</text>
    <text x="190" y="1300" fill-opacity="0.5">KENSINGTON GARDENS</text>
    <text x="200" y="1420" fill-opacity="0.5">HYDE PARK</text>
    <text x="1050" y="1600">MAYFAIR</text>
    <text x="120" y="1720">SOUTH KENSINGTON</text>
    <text x="640" y="2010" fill="#d8b46e" fill-opacity="0.6">RIVER THAMES</text>
    <text x="1180" y="1560">ST JAMES'S</text>
  </g>
</svg>
